name: Build MarketMint Mobile APK

on:
  push:
    branches:
      - build/mobile-v1.14.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Decode Android source
        run: |
          mkdir -p mobile-control-android/project
          base64 --decode mobile-control-android/MarketMintMobile-source.tar.gz.b64 | tar -xzf - -C mobile-control-android/project

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate release signing key
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/marketmint-mobile-release.jks" -storepass "$password" -keypass "$password" -alias marketmint-mobile -keyalg RSA -keysize 4096 -validity 10000 -dname 'CN=MarketMint Mobile, OU=EBE Designs, O=EBE Designs, L=Menlo Park, ST=California, C=US'
          echo "MM_KEYSTORE_PATH=$RUNNER_TEMP/marketmint-mobile-release.jks" >> "$GITHUB_ENV"
          echo "MM_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "MM_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "MM_KEY_ALIAS=marketmint-mobile" >> "$GITHUB_ENV"
          printf 'Alias: marketmint-mobile\nPassword: %s\n' "$password" > "$RUNNER_TEMP/SIGNING-INFO.txt"

      - name: Test and lint
        working-directory: mobile-control-android/project
        run: gradle --no-daemon testReleaseUnitTest lintRelease

      - name: Build signed release APK
        working-directory: mobile-control-android/project
        run: gradle --no-daemon assembleRelease

      - name: Verify and package
        run: |
          set -euo pipefail
          apk='mobile-control-android/project/app/build/outputs/apk/release/app-release.apk'
          apksigner verify --verbose --print-certs "$apk"
          mkdir -p release/private-signing
          cp "$apk" release/MarketMint-Mobile-Control-v1.14.1.apk
          cp "$MM_KEYSTORE_PATH" release/private-signing/marketmint-mobile-release.jks
          cp "$RUNNER_TEMP/SIGNING-INFO.txt" release/private-signing/SIGNING-INFO.txt
          cp mobile-control-android/project/README.md release/ANDROID-SOURCE-README.md
          sha256sum release/MarketMint-Mobile-Control-v1.14.1.apk > release/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MarketMint-Mobile-Control-v1.14.1
          path: release/
          if-no-files-found: error
          retention-days: 30
