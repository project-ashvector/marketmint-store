name: Temporary MarketMint Mobile Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile-control-android/**'
      - '.github/workflows/temporary-marketmint-mobile-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode Android source
        run: |
          mkdir -p mobile-control-android/project
          base64 --decode mobile-control-android/source.fixed.b64 | tar -xzf - -C mobile-control-android/project
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate signing key
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          keytool -genkeypair -keystore "$RUNNER_TEMP/marketmint.jks" -storepass "$password" -keypass "$password" -alias marketmint -keyalg RSA -keysize 4096 -validity 10000 -dname 'CN=MarketMint Mobile, OU=EBE Designs, O=EBE Designs, L=Menlo Park, ST=California, C=US'
          echo "MM_KEYSTORE_PATH=$RUNNER_TEMP/marketmint.jks" >> "$GITHUB_ENV"
          echo "MM_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "MM_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "MM_KEY_ALIAS=marketmint" >> "$GITHUB_ENV"
      - name: Test and build
        working-directory: mobile-control-android/project
        run: gradle --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Verify APK signature
        run: |
          apk='mobile-control-android/project/app/build/outputs/apk/release/app-release.apk'
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
      - name: Install and launch on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            apk='mobile-control-android/project/app/build/outputs/apk/release/app-release.apk'
            adb install -r "$apk"
            adb logcat -c
            adb shell am start -W -n com.ebedesigns.marketmint.mobile/.MainActivity
            sleep 5
            pid="$(adb shell pidof -s com.ebedesigns.marketmint.mobile | tr -d '\r')"
            test -n "$pid"
            if adb logcat -b crash -d | grep -q 'com.ebedesigns.marketmint.mobile'; then
              adb logcat -b crash -d
              exit 1
            fi
      - name: Package verified APK
        run: |
          apk='mobile-control-android/project/app/build/outputs/apk/release/app-release.apk'
          mkdir release
          cp "$apk" release/MarketMint-Mobile-Control-v1.14.1.apk
          sha256sum release/MarketMint-Mobile-Control-v1.14.1.apk > release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MarketMint-Mobile-Control-v1.14.1
          path: release/
          retention-days: 30
