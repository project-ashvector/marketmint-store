name: Build MarketMint Mobile v1.15.2 Install Fix

on:
  push:
    branches:
      - build/marketmint-mobile-v1.15.2-install-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact successful v1.15.1 source
        run: |
          set -euo pipefail
          mkdir -p mobile-build/project mobile-build/snapshot
          git fetch origin build/mobile-v1.15.1-brightness --depth=1
          git archive --format=tar origin/build/mobile-v1.15.1-brightness \
            mobile-control-android/source.fixed.b64 \
            mobile-control-android/override-parts \
            mobile-control-android/v1151-parts \
            assets/site-background.png \
            | tar -xf - -C mobile-build/snapshot

          base64 --decode mobile-build/snapshot/mobile-control-android/source.fixed.b64 \
            | tar -xzf - -C mobile-build/project

          cat mobile-build/snapshot/mobile-control-android/override-parts/part-* \
            > "$RUNNER_TEMP/overrides.v115.b64"
          test "$(sha256sum "$RUNNER_TEMP/overrides.v115.b64" | cut -d' ' -f1)" \
            = "4a64d44ad055c03415cde027de1f5e3f14e74e7c17f8c9bdc690122f1db7f95c"
          base64 --decode "$RUNNER_TEMP/overrides.v115.b64" \
            | tar -xzf - -C mobile-build/project

          cat mobile-build/snapshot/mobile-control-android/v1151-parts/part-* \
            > "$RUNNER_TEMP/overrides.v1151.b64"
          test "$(sha256sum "$RUNNER_TEMP/overrides.v1151.b64" | cut -d' ' -f1)" \
            = "9bb87b45672f61c53d46046fff0fb31bbe6f7a8b8189ab2d51a1fa5745516e36"
          base64 --decode "$RUNNER_TEMP/overrides.v1151.b64" \
            | tar -xzf - -C mobile-build/project

          sed -i '/android:windowLightNavigationBar/d' \
            mobile-build/project/app/src/main/res/values/themes.xml
          mkdir -p mobile-build/project/app/src/main/res/drawable-nodpi
          cp mobile-build/snapshot/assets/site-background.png \
            mobile-build/project/app/src/main/res/drawable-nodpi/site_background.png

          test -f mobile-build/project/app/build.gradle
          test -f mobile-build/project/app/src/main/java/com/ebedesigns/marketmint/mobile/MainActivity.java

      - name: Apply install-safe identity and permanent version line
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('mobile-build/project/app/build.gradle')
          text = gradle.read_text()
          text = re.sub(r"applicationId\s+'[^']+'", "applicationId 'com.ebedesigns.marketmint.controlcenter'", text)
          text = re.sub(r'versionCode\s+\d+', 'versionCode 11502', text)
          text = re.sub(r"versionName\s+'[^']+'", "versionName '1.15.2'", text)
          text = re.sub(r'\n\s{4}signingConfigs \{.*?\n\s{4}\}\n', '\n', text, flags=re.S)
          text = re.sub(r'^\s*signingConfig signingConfigs\.release\s*$', '', text, flags=re.M)
          gradle.write_text(text)

          activity = Path('mobile-build/project/app/src/main/java/com/ebedesigns/marketmint/mobile/MainActivity.java')
          activity_text = activity.read_text().replace('MOBILE_VERSION = "1.15.1"', 'MOBILE_VERSION = "1.15.2"')
          activity.write_text(activity_text)
          PY

          grep -F "applicationId 'com.ebedesigns.marketmint.controlcenter'" mobile-build/project/app/build.gradle
          grep -E 'versionCode +11502' mobile-build/project/app/build.gradle
          grep -F "versionName '1.15.2'" mobile-build/project/app/build.gradle
          grep -F 'MOBILE_VERSION = "1.15.2"' mobile-build/project/app/src/main/java/com/ebedesigns/marketmint/mobile/MainActivity.java
          ! grep -q 'signingConfig signingConfigs.release' mobile-build/project/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run tests, lint, and build unsigned release
        working-directory: mobile-build/project
        run: gradle --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Align APK and export signing tools
        run: |
          set -euo pipefail
          mkdir -p release
          unsigned="$(find mobile-build/project/app/build/outputs/apk/release -maxdepth 1 -type f -name '*unsigned*.apk' -print -quit)"
          test -n "$unsigned"
          aligned='release/MarketMint-Mobile-Control-v1.15.2-aligned-unsigned.apk'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$unsigned" "$aligned"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$aligned"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$aligned" > release/PACKAGE-METADATA.txt
          grep -F "package: name='com.ebedesigns.marketmint.controlcenter' versionCode='11502' versionName='1.15.2'" release/PACKAGE-METADATA.txt
          sha256sum "$aligned" release/apksigner.jar release/PACKAGE-METADATA.txt > release/SHA256SUMS.txt

      - name: Upload unsigned build kit
        uses: actions/upload-artifact@v4
        with:
          name: MarketMint-Mobile-v1.15.2-Unsigned-Build-Kit
          path: release/
          if-no-files-found: error
          retention-days: 1
