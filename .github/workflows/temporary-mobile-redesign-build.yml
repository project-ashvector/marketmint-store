name: Temporary MarketMint Mobile Redesign

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile-control-android/**'
      - '.github/workflows/temporary-mobile-redesign-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble redesigned Android source
        run: |
          set -euo pipefail
          mkdir -p mobile-control-android/project
          base64 --decode mobile-control-android/source.fixed.b64 | tar -xzf - -C mobile-control-android/project
          cat mobile-control-android/override-parts/part-* > "$RUNNER_TEMP/overrides.v115.b64"
          test "$(sha256sum "$RUNNER_TEMP/overrides.v115.b64" | cut -d' ' -f1)" = "4a64d44ad055c03415cde027de1f5e3f14e74e7c17f8c9bdc690122f1db7f95c"
          base64 --decode "$RUNNER_TEMP/overrides.v115.b64" | tar -xzf - -C mobile-control-android/project
          sed -i '/android:windowLightNavigationBar/d' mobile-control-android/project/app/src/main/res/values/themes.xml
          mkdir -p mobile-control-android/project/app/src/main/res/drawable-nodpi
          cp assets/site-background.png mobile-control-android/project/app/src/main/res/drawable-nodpi/site_background.png

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Generate release signing key
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          keytool -genkeypair -keystore "$RUNNER_TEMP/marketmint.jks" -storepass "$password" -keypass "$password" -alias marketmint -keyalg RSA -keysize 4096 -validity 10000 -dname 'CN=MarketMint Mobile, OU=EBE Designs, O=EBE Designs, L=Menlo Park, ST=California, C=US'
          echo "MM_KEYSTORE_PATH=$RUNNER_TEMP/marketmint.jks" >> "$GITHUB_ENV"
          echo "MM_KEYSTORE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "MM_KEY_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "MM_KEY_ALIAS=marketmint" >> "$GITHUB_ENV"

      - name: Unit test, lint, and build release
        working-directory: mobile-control-android/project
        run: gradle --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Verify release signature
        run: |
          apk='mobile-control-android/project/app/build/outputs/apk/release/app-release.apk'
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"

      - name: Install, launch, and capture Android 15 evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_6
          disable-animations: true
          script: mkdir -p release; adb install -r mobile-control-android/project/app/build/outputs/apk/release/app-release.apk; adb logcat -c; adb shell am start -W -n com.ebedesigns.marketmint.mobile/.MainActivity | tee release/launch.txt; sleep 8; adb shell dumpsys activity activities | grep -m1 'mResumedActivity' > release/activity.txt || true; adb shell pidof -s com.ebedesigns.marketmint.mobile > release/process.txt || true; adb logcat -b crash -d > release/crash.txt || true; adb exec-out screencap -p > release/MarketMint-Mobile-v1.15.0-Android15.png

      - name: Verify Android 15 startup evidence
        run: |
          set -euo pipefail
          grep -q 'Status: ok' release/launch.txt
          grep -q 'com.ebedesigns.marketmint.mobile/.MainActivity' release/launch.txt
          if grep -q 'com.ebedesigns.marketmint.mobile' release/crash.txt; then
            cat release/crash.txt
            exit 1
          fi
          test -s release/MarketMint-Mobile-v1.15.0-Android15.png

      - name: Package verified APK
        run: |
          set -euo pipefail
          apk='mobile-control-android/project/app/build/outputs/apk/release/app-release.apk'
          mkdir -p release
          cp "$apk" release/MarketMint-Mobile-Control-v1.15.0.apk
          sha256sum release/MarketMint-Mobile-Control-v1.15.0.apk > release/SHA256SUMS.txt

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: MarketMint-Mobile-Control-v1.15.0
          path: release/
          retention-days: 30
