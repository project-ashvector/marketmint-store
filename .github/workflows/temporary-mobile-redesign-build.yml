name: Build MarketMint Mobile v1.15.2 Install Fix

on:
  push:
    branches:
      - build/marketmint-mobile-v1.15.2-install-fix
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unsigned:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated mobile branch
        uses: actions/checkout@v4

      - name: Reconstruct verified v1.15.2 Android source
        run: |
          set -euo pipefail
          mkdir -p mobile-build/project
          cat mobile-control-android/v1152-source-parts/part-* \
            | base64 --decode \
            | tar -xzf - -C mobile-build/project

      - name: Confirm install-safe identity
        run: |
          set -euo pipefail
          grep -F "applicationId 'com.ebedesigns.marketmint.controlcenter'" mobile-build/project/app/build.gradle
          grep -E 'versionCode +11502' mobile-build/project/app/build.gradle
          grep -F "versionName '1.15.2'" mobile-build/project/app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run tests, lint, and unsigned release build
        working-directory: mobile-build/project
        run: gradle --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Align APK and export signing tools
        run: |
          set -euo pipefail
          mkdir -p release
          unsigned='mobile-build/project/app/build/outputs/apk/release/app-release-unsigned.apk'
          aligned='release/MarketMint-Mobile-Control-v1.15.2-aligned-unsigned.apk'
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -p -f 4 "$unsigned" "$aligned"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release/apksigner.jar
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$aligned" > release/PACKAGE-METADATA.txt
          sha256sum "$aligned" release/apksigner.jar > release/SHA256SUMS.txt

      - name: Upload unsigned build kit
        uses: actions/upload-artifact@v4
        with:
          name: MarketMint-Mobile-v1.15.2-Unsigned-Build-Kit
          path: release/
          if-no-files-found: error
          retention-days: 1
