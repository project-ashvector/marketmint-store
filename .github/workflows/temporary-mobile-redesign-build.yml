name: Temporary MarketMint Mobile Redesign

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile-control-android/**'
      - '.github/workflows/temporary-mobile-redesign-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode Android project
        run: |
          set -euo pipefail
          mkdir -p export/project
          base64 --decode mobile-control-android/source.fixed.b64 | tar -xzf - -C export/project
      - name: Upload decoded source
        uses: actions/upload-artifact@v4
        with:
          name: MarketMint-Mobile-Source-v1.14.1
          path: export/project/
          retention-days: 1
