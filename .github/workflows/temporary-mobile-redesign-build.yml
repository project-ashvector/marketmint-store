name: Temporary MarketMint Mobile Redesign

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile-control-android/**'
      - '.github/workflows/temporary-mobile-redesign-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode Android project
        run: |
          set -euo pipefail
          mkdir -p export/mobile
          base64 --decode mobile-control-android/source.fixed.b64 | tar -xzf - -C export/mobile
      - name: Collect desktop app source and assets
        run: |
          set -euo pipefail
          mkdir -p export/repository
          rsync -a --exclude='.git/' --exclude='export/' --exclude='mobile-control-android/source.fixed.b64' ./ export/repository/
      - name: Upload inspection source
        uses: actions/upload-artifact@v4
        with:
          name: MarketMint-Redesign-Inspection-Source
          path: export/
          retention-days: 1
